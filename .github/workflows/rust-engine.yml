name: Rust engine and native workflow
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: engine/target
      CARGO_BUILD_JOBS: 1
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/source
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache locked dependencies for all targets
        # The offline SBOM needs metadata for the whole lockfile, including
        # dependencies that a host-only build does not download.
        run: cargo fetch --locked --manifest-path engine/Cargo.toml
      - name: Format
        run: cargo fmt --manifest-path engine/Cargo.toml -- --check
      - name: Lint
        run: cargo clippy --locked --manifest-path engine/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --locked --manifest-path engine/Cargo.toml --all-targets
      - name: Build both native binaries
        run: cargo build --locked --release --manifest-path engine/Cargo.toml --bins
      - name: Native checks on Windows
        if: runner.os == 'Windows'
        run: engine/target/release/stm-tool.exe check
      - name: Native checks on Linux
        if: runner.os != 'Windows'
        run: engine/target/release/stm-tool check
