name: Public source integrity
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: engine/target
      CARGO_BUILD_JOBS: 1
      RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/source
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release --manifest-path engine/Cargo.toml --bin stm-tool
      - run: engine/target/release/stm-tool release-verify
      - run: engine/target/release/stm-tool privacy
      - run: engine/target/release/stm-tool pack-source --output output/SchoolThreatMitigation-rust-source.zip
