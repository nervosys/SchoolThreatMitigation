name: Public release checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Privacy and secret scan
        run: python3 scripts/privacy_check.py
      - name: Validate release structure and files
        run: python3 scripts/verify_release.py
      - name: Verify release checksums
        run: sha256sum --check SHA256SUMS.txt
